<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع - Root Forest</title>
    <link rel="stylesheet" href="style-new.css">
    <style>
        .checkout-container {
            max-width: 800px;
            margin: 2rem auto;
            background: var(--white);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--light-color);
            padding-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark-color);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--light-color);
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(220, 20, 60, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .quantity-control button {
            background: var(--light-color);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            transition: var(--transition);
        }

        .quantity-control button:hover {
            background: var(--primary-color);
            color: var(--white);
        }

        .quantity-control input {
            width: 60px !important;
            text-align: center;
            border: 2px solid var(--light-color);
        }

        .order-summary {
            background: var(--light-color);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .summary-row.total {
            border-top: 2px solid var(--dark-color);
            padding-top: 1rem;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .error-message {
            background: #fee;
            color: var(--error-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message {
            background: #efe;
            color: var(--success-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .checkout-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .checkout-buttons button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color) 0%, #b00030 100%);
            color: var(--white);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-back {
            background: var(--light-color);
            color: var(--dark-color);
            border: 2px solid var(--light-color);
        }

        .btn-back:hover {
            background: var(--dark-color);
            color: var(--white);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 1rem;
        }

        .spinner {
            border: 4px solid var(--light-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .checkout-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="container" style="display: flex; justify-content: space-between; width: 100%;">
                <div class="logo">
                    <h1>🌿 Root Forest</h1>
                </div>
                <div style="text-align: left;">
                    <a href="./index-new.html" style="color: white; text-decoration: none; font-weight: 600;">← العودة للصفحة الرئيسية</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Checkout Content -->
    <div class="checkout-container">
        <div class="checkout-header">
            <h2>💳 إتمام الطلب</h2>
            <p>يرجى ملء البيانات أدناه</p>
        </div>

        <div id="errorAlert" class="error-message"></div>
        <div id="successAlert" class="success-message"></div>

        <form id="checkoutForm">
            <!-- معلومات العميل -->
            <div class="form-group">
                <label>الاسم الكامل *</label>
                <input type="text" id="fullName" placeholder="مثال: أحمد محمد علي" required>
            </div>

            <div class="form-group">
                <label>رقم الهاتف *</label>
                <input type="tel" id="phone" placeholder="مثال: 0661234567" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>الولاية *</label>
                    <select id="wilaya" required>
                        <option value="">-- اختر الولاية --</option>
                        <option value="الجزائر">الجزائر</option>
                        <option value="الدار البيضاء">الدار البيضاء</option>
                        <option value="البليدة">البليدة</option>
                        <option value="قسنطينة">قسنطينة</option>
                        <option value="عنابة">عنابة</option>
                        <option value="وهران">وهران</option>
                        <option value="سطيف">سطيف</option>
                        <option value="المسيلة">المسيلة</option>
                        <option value="تيزي وزو">تيزي وزو</option>
                        <option value="بجاية">بجاية</option>
                        <option value="تيبازة">تيبازة</option>
                        <option value="بومرداس">بومرداس</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>الكمية *</label>
                    <div class="quantity-control">
                        <button type="button" onclick="decreaseQty()">−</button>
                        <input type="number" id="quantity" value="1" min="1" readonly>
                        <button type="button" onclick="increaseQty()">+</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>العنوان الكامل *</label>
                <textarea id="address" placeholder="مثال: شارع النيل، حي المنار" rows="3" required></textarea>
            </div>

            <!-- ملخص الطلب -->
            <div class="order-summary">
                <div class="summary-row">
                    <span>سعر الوحدة:</span>
                    <span>3,800 دج</span>
                </div>
                <div class="summary-row">
                    <span>الكمية:</span>
                    <span id="summaryQty">1</span>
                </div>
                <div class="summary-row">
                    <span>الإجمالي الجزئي:</span>
                    <span id="subtotal">3,800</span> دج
                </div>
                <div class="summary-row">
                    <span>رسوم التوصيل:</span>
                    <span id="shippingCost">300</span> دج
                </div>
                <div class="summary-row total">
                    <span>المبلغ الإجمالي:</span>
                    <span id="totalAmount">4,100</span> دج
                </div>
            </div>

            <!-- Buttons -->
            <div class="checkout-buttons">
                <button type="button" class="btn-back" onclick="goBack()">إلغاء</button>
                <button type="submit" class="btn-submit" id="submitBtn">إرسال الطلب</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جاري معالجة الطلب...</p>
            </div>
        </form>
    </div>

    <script src="script-new.js"></script>
    <script>
        const PRODUCT_PRICE = 3800;
        const BASE_SHIPPING = 300;

        // زيادة الكمية
        function increaseQty() {
            const qty = document.getElementById('quantity');
            qty.value = parseInt(qty.value) + 1;
            updateSummary();
        }

        // تقليل الكمية
        function decreaseQty() {
            const qty = document.getElementById('quantity');
            if (parseInt(qty.value) > 1) {
                qty.value = parseInt(qty.value) - 1;
            }
            updateSummary();
        }

        // تحديث الملخص
        function updateSummary() {
            const qty = parseInt(document.getElementById('quantity').value);
            const subtotal = PRODUCT_PRICE * qty;
            const shipping = BASE_SHIPPING;
            const total = subtotal + shipping;

            document.getElementById('summaryQty').textContent = qty;
            document.getElementById('subtotal').textContent = subtotal.toLocaleString();
            document.getElementById('totalAmount').textContent = total.toLocaleString();
        }

        // العودة للصفحة السابقة
        function goBack() {
            window.history.back();
        }

        // إرسال الطلب
        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const wilaya = document.getElementById('wilaya').value;
            const address = document.getElementById('address').value.trim();
            const quantity = parseInt(document.getElementById('quantity').value);

            // التحقق من البيانات
            if (!fullName || !phone || !wilaya || !address) {
                showError('يرجى ملء جميع الحقول المطلوبة');
                return;
            }

            // التحقق من صيغة الهاتف
            if (!/^[0-9]{10}$/.test(phone.replace(/\D/g, ''))) {
                showError('رقم الهاتف غير صحيح');
                return;
            }

            // إعداد البيانات
            const orderData = {
                customer: {
                    fullName,
                    phone,
                    wilaya,
                    address
                },
                items: [
                    {
                        name: 'Root Forest مسحوق بروتين',
                        quantity,
                        price: PRODUCT_PRICE
                    }
                ],
                total: (PRODUCT_PRICE * quantity) + BASE_SHIPPING,
                timestamp: new Date().toISOString()
            };

            // إرسال الطلب
            await submitOrder(orderData);
        });

        async function submitOrder(orderData) {
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            
            submitBtn.disabled = true;
            loading.style.display = 'block';

            try {
                // إرسال إلى السيرفر
                const response = await fetch('./api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // نجاح الطلب
                    showSuccess('تم استقبال طلبك بنجاح! سيتم التواصل معك قريباً.');
                    document.getElementById('checkoutForm').reset();
                    updateSummary();
                    
                    // مسح السلة
                    localStorage.removeItem('cart');
                    
                    // الرجوع بعد 3 ثواني
                    setTimeout(() => {
                        window.location.href = './index-new.html';
                    }, 3000);
                } else {
                    showError(result.message || 'حدث خطأ في إرسال الطلب');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('فشل الاتصال بالخادم. يرجى المحاولة لاحقاً.');
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showError(message) {
            const alert = document.getElementById('errorAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            alert.textContent = message;
            alert.style.display = 'block';
        }

        // تحديث الملخص عند التحميل
        document.addEventListener('DOMContentLoaded', () => {
            updateSummary();
        });
    </script>
</body>
</html>
