# مثال على إعدادات Nginx لـ Root Forest
# ضع هذا الملف في: /etc/nginx/sites-available/root-forest.conf
# ثم فعّله: sudo ln -s /etc/nginx/sites-available/root-forest.conf /etc/nginx/sites-enabled/

# معادل HTTP → HTTPS
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    
    # إعادة توجيه إلى HTTPS
    return 301 https://$server_name$request_uri;
}

# الخادم الرئيسي (HTTPS)
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # شهادات SSL (استخدم Certbot لتوليدها)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    # إعدادات SSL للأمان
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # المجلد الجذر للملفات الثابتة
    root /var/www/html/root-forest;
    index index.html;

    # معالجة الملفات الثابتة
    location / {
        try_files $uri $uri/ =404;
        
        # تخزين مؤقت للملفات الثابتة
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # توجيه طلبات API إلى خادم Node.js المحلي
    # (إذا كان API يعمل على localhost:3000)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # حظر الملفات الحساسة
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ضغط الملفات
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-component text/x-cross-domain-policy;
}

# ملاحظات الإعداد:
# 
# 1. استبدل "your-domain.com" باسم النطاق الفعلي الخاص بك
# 2. استخدم Certbot لتوليد شهادات SSL:
#    sudo certbot --nginx -d your-domain.com -d www.your-domain.com
# 3. تأكد من أن مجلد الملفات موجود: /var/www/html/root-forest/
# 4. ضع ملف index.html في /var/www/html/root-forest/
# 5. أعد تشغيل Nginx بعد التغييرات:
#    sudo systemctl restart nginx
# 6. للتحقق من الإعدادات:
#    sudo nginx -t
# 7. إذا كان لديك API، تأكد من تشغيل الخادم على localhost:3000
#
# أوامر مفيدة:
# - عرض حالة Nginx: sudo systemctl status nginx
# - عرض السجلات: sudo tail -f /var/log/nginx/access.log
# - إعادة تشغيل بدون قطع الاتصال: sudo systemctl reload nginx
